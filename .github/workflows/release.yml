name: Release installers

on:
  push:
    branches: ['release']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Create release snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.snapshot.outputs.version }}
      branch: ${{ steps.snapshot.outputs.branch }}
      commit: ${{ steps.snapshot.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify application versions
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          node scripts/release-version.mjs check "v$version"
      - name: Create immutable snapshot branch
        id: snapshot
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const createSnapshot = require('./scripts/release-snapshot.cjs');
            const { version } = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
            const snapshot = await createSnapshot({ github, context, version, runAttempt: process.env.GITHUB_RUN_ATTEMPT });
            for (const [name, value] of Object.entries(snapshot)) core.setOutput(name, value);

  installers:
    name: Build and publish snapshot
    needs: snapshot
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.snapshot.outputs.version }}
      branch: ${{ needs.snapshot.outputs.branch }}
      commit: ${{ needs.snapshot.outputs.commit }}
