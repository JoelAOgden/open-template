name: Desktop builds
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action snapshot
        with:
          toolchain: stable
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm run build
      - run: node --import tsx --test tests/desktop.test.ts
      - if: runner.os == 'macOS'
        run: npm test
      - run: npm run desktop:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-template-${{ runner.os }}
          path: src-tauri/target/release/bundle/
