name: Desktop builds
on:
  workflow_dispatch:
  pull_request:
    paths: ['src-tauri/**', 'server/**', 'shared/**', 'src/**', 'scripts/**', 'package*.json', '.github/workflows/desktop.yml']
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm run build
      - run: node --import tsx --test tests/desktop.test.ts
      - if: runner.os == 'macOS'
        run: npm test
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: open-template-${{ runner.os }}
          path: src-tauri/target/release/bundle/
